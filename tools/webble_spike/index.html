<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Floatface webble_spike</title>
    <style>
      body { font-family: ui-monospace, monospace; background: #111; color: #ddd; padding: 1.5rem; max-width: 720px; margin: 0 auto; }
      h1 { font-size: 1.1rem; }
      button { font: inherit; padding: 0.4rem 0.9rem; margin-right: 0.5rem; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      #devices { margin: 1rem 0; }
      .device { display: flex; align-items: center; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid #333; }
      .device button { margin: 0; }
      #log { background: #000; padding: 0.75rem; height: 12rem; overflow-y: auto; white-space: pre-wrap; font-size: 0.85rem; }
      #result { background: #052; padding: 0.75rem; white-space: pre-wrap; display: none; }
      #result.visible { display: block; }
    </style>
  </head>
  <body>
    <h1>Floatface webble_spike -- JS port validation (not the polished PWA yet)</h1>
    <p>Requires Chrome/Edge/Brave (Web Serial) served over http/https, not file://. Turn off your laptop's own Bluetooth before capturing -- see project notes.</p>
    <p>
      <button id="connectBtn">Connect to dongle</button>
      <button id="scanBtn" disabled>Scan for ow* boards</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
    </p>
    <div id="devices"></div>
    <div id="log"></div>
    <div id="result"></div>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
